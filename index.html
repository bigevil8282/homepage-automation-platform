<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>랜딩페이지·퍼널 자동화 스튜디오</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <aside class="builder" aria-label="랜딩페이지와 퍼널 자동화 설정">
      <div class="brand-lockup">
        <div class="mark">F</div>
        <div>
          <p class="eyebrow">Landing & Funnel Automation</p>
          <h1>전문 마케팅 퍼널 생성기</h1>
        </div>
      </div>

      <section class="panel">
        <h2>1. 업종 템플릿</h2>
        <div class="template-grid" id="industryGrid" role="radiogroup" aria-label="업종 템플릿"></div>
      </section>

      <section class="panel">
        <h2>2. 브랜드 정보</h2>
        <label>
          상호명
          <input id="businessName" type="text" value="브라이트 스튜디오" autocomplete="organization">
        </label>
        <label>
          핵심 서비스
          <input id="mainService" type="text" value="맞춤형 상담과 실행 솔루션">
        </label>
        <label>
          지역 / 영업권
          <input id="serviceArea" type="text" value="서울 및 수도권">
        </label>
        <label>
          대표 고객
          <input id="targetCustomer" type="text" value="빠르고 믿을 수 있는 전문가를 찾는 고객">
        </label>
      </section>

      <section class="panel">
        <h2>3. 랜딩페이지 전략</h2>
        <label>
          톤
          <select id="tone">
            <option value="trust">신뢰감 있는 전문가</option>
            <option value="premium">고급스럽고 섬세한</option>
            <option value="friendly">친근하고 쉬운</option>
            <option value="urgent">즉시 문의를 유도하는</option>
          </select>
        </label>
        <label>
          전환 목표
          <select id="goal">
            <option value="consult">무료 상담 신청</option>
            <option value="booking">예약 유도</option>
            <option value="quote">견적 문의</option>
            <option value="store">방문 / 구매 유도</option>
          </select>
        </label>
        <label>
          강조 포인트
          <textarea id="proofPoints" rows="4">빠른 응답, 투명한 가격, 풍부한 현장 경험, 사후 관리</textarea>
        </label>
      </section>

      <section class="panel">
        <h2>4. 퍼널 설계</h2>
        <label>
          리드마그넷
          <input id="leadMagnet" type="text" value="무료 진단 체크리스트">
        </label>
        <label>
          문의 채널
          <select id="contactChannel">
            <option value="phone">전화 상담</option>
            <option value="kakao">카카오톡 상담</option>
            <option value="form">폼 접수</option>
            <option value="calendar">예약 캘린더</option>
          </select>
        </label>
        <label>
          후속 메시지
          <textarea id="followUp" rows="3">문의 후 10분 안에 담당자가 확인하고 다음 진행 방법을 안내드립니다.</textarea>
        </label>
      </section>

      <section class="panel">
        <h2>5. 자동화 도구</h2>
        <div class="action-row">
          <button id="shuffleCopy" class="secondary" type="button">문구 새로 만들기</button>
          <button id="copyHtml" type="button">HTML 복사</button>
        </div>
        <div class="action-row">
          <button id="downloadHtml" class="secondary wide" type="button">완성 퍼널 페이지 다운로드</button>
        </div>
        <p class="helper">입력값을 바꾸면 랜딩페이지, 퍼널 단계, SEO, 광고 문구가 즉시 갱신됩니다.</p>
      </section>
    </aside>

    <section class="workspace">
      <nav class="topbar" aria-label="미리보기 도구">
        <div class="device-tabs" role="tablist" aria-label="기기 미리보기">
          <button class="device-tab active" data-device="desktop" type="button">데스크톱</button>
          <button class="device-tab" data-device="mobile" type="button">모바일</button>
        </div>
        <div class="status-pill">랜딩부터 퍼널까지 자동 구성</div>
      </nav>

      <div class="preview-frame desktop" id="previewFrame">
        <article class="site-preview" id="sitePreview" aria-label="생성된 랜딩페이지와 퍼널 미리보기"></article>
      </div>

      <section class="output-panel">
        <div>
          <p class="eyebrow">Generated Funnel Assets</p>
          <h2>마케팅 운영 패키지</h2>
        </div>
        <div class="asset-grid">
          <div>
            <span>SEO 제목</span>
            <strong id="seoTitle"></strong>
          </div>
          <div>
            <span>검색 설명</span>
            <strong id="seoDescription"></strong>
          </div>
          <div>
            <span>광고 문구</span>
            <strong id="adCopy"></strong>
          </div>
          <div>
            <span>퍼널 단계</span>
            <strong id="funnelSummary"></strong>
          </div>
          <div>
            <span>리드 저장</span>
            <strong>Vercel API → Supabase leads</strong>
          </div>
        </div>
      </section>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
